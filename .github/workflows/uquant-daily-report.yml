name: Private uquant daily report

on:
  workflow_dispatch:
  schedule:
    - cron: '1 9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: uquant-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    if: github.repository == 'geniusgrok/uquant-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public bootstrap only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - name: Run production scan and private publication
        env:
          UQUANT_READ_TOKEN: ${{ secrets.UQUANT_READ_TOKEN }}
          UQUANT_REPORT_WRITE_TOKEN: ${{ secrets.UQUANT_REPORT_WRITE_TOKEN }}
        run: python scripts/run_private_daily.py
      # Never upload the private workspace, cache, logs or report as a public artifact.
