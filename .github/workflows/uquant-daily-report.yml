name: Uquant daily report
on:
  workflow_dispatch:
  schedule:
    - cron: '31 8 * * 1-5' # 北京时间 16:31
    - cron: '36 9 * * 1-5' # 北京时间 17:36，行情晚到时自动补跑
    - cron: '36 10 * * 1-5' # 北京时间 18:36，第二次补跑
  push:
    branches: [main]
    paths: ['uquant_cli/**', 'bootstrap.py', 'preflight.py', 'runner.py', 'publish_main_report.py', '.github/workflows/uquant-daily-report.yml']
permissions:
  contents: read
concurrency:
  group: uquant-daily-report
  cancel-in-progress: false
jobs:
  daily-report:
    if: github.repository == 'geniusgrok/uquant-cli' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read production main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ychenracing/uquant
          ref: main
          token: ${{ secrets.UQUANT_READ_TOKEN }}
          persist-credentials: false
          path: .runtime/production
      - name: Open this repository's existing report branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: uquant-daily-reports
          path: .runtime/report-state
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Run production and publish only in uquant-cli
        env:
          UQUANT_SOURCE_DIR: ${{ github.workspace }}/.runtime/production
          UQUANT_REPORT_STATE: ${{ github.workspace }}/.runtime/report-state
        run: python runner.py
      - name: Publish verified Markdown report to main
        env:
          REPORT_STATE_DIR: ${{ github.workspace }}/.runtime/report-state
          REPORT_PUBLISH_TOKEN: ${{ github.token }}
        run: python publish_main_report.py
      - name: Retain approved originals when a run fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/events.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/status.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/calendar.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/report.md
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/result.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/decision.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/account_before.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/account_after.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/inputs/audit.json
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/inputs/sh*.csv
            ${{ runner.temp }}/uquant-cli-${{ github.run_id }}-${{ github.run_attempt }}/operation/publishable/inputs/sz*.csv
          if-no-files-found: warn
          retention-days: 30
