name: Public bootstrap verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python -m unittest discover -s tests -p test_bootstrap.py -v
      - name: Archive public CLI source only
        run: git archive HEAD README.md scripts tests cli_runtime .github/workflows > "$RUNNER_TEMP/public-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-bootstrap-source-${{ github.sha }}
          path: ${{ runner.temp }}/public-source.tar
          if-no-files-found: error
          retention-days: 30
