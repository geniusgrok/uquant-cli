name: Production observer integration
on:
  pull_request:
    paths: ['uquant_cli/**', 'bootstrap.py', 'preflight.py', 'runner.py', 'verify_integrity.py', 'tests/**', '.github/workflows/delivery-validation.yml']
  push:
    branches: [main]
    paths: ['uquant_cli/**', 'bootstrap.py', 'preflight.py', 'runner.py', 'verify_integrity.py', 'tests/**', '.github/workflows/delivery-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'geniusgrok/uquant-cli' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read current production source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ychenracing/uquant
          ref: main
          token: ${{ secrets.UQUANT_READ_TOKEN }}
          persist-credentials: false
          path: .runtime/production
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Check unchanged production engine and local test repository
        env:
          UQUANT_SOURCE_DIR: ${{ github.workspace }}/.runtime/production
        run: python verify_integrity.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observer-validation-${{ github.sha }}
          path: validation/*.json
          if-no-files-found: error
          retention-days: 30
