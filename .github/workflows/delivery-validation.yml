name: Delivery integration verification
on:
  pull_request:
    paths:
      - scripts/check_private_pipeline.py
      - .github/workflows/delivery-validation.yml
permissions:
  contents: read
jobs:
  verify-private-candidate:
    if: github.repository == 'geniusgrok/uquant-cli' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Check production fixture and public delivery boundaries
        env:
          UQUANT_READ_TOKEN: ${{ secrets.UQUANT_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_CANDIDATE_SHA: dc39197752e164a0ec5ca8bbf5d8d15a0b7214f1
        run: python -m scripts.check_private_pipeline
