name: Uquant daily report
on:
  workflow_dispatch:
  schedule:
    - cron: '1 9 * * 1-5'
  push:
    branches: [main]
    paths: ['cli_runtime/**', 'scripts/run_private_daily.py', '.github/workflows/uquant-daily-report.yml']
permissions:
  contents: read
concurrency:
  group: uquant-daily-report
  cancel-in-progress: false
jobs:
  daily-report:
    if: github.repository == 'geniusgrok/uquant-cli' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read production main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ychenracing/uquant
          ref: main
          token: ${{ secrets.UQUANT_READ_TOKEN }}
          persist-credentials: false
          path: .runtime/production
      - name: Open this repository's existing report branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: uquant-daily-reports
          path: .runtime/report-state
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Run production and publish only in uquant-cli
        env:
          UQUANT_SOURCE_DIR: ${{ github.workspace }}/.runtime/production
          UQUANT_REPORT_STATE: ${{ github.workspace }}/.runtime/report-state
        run: python scripts/run_private_daily.py
